-- /etc/beebreeder.cfg  (controller). Plain Lua table; copy and edit.
{
  dataDir = "/home/beebreeder",
  port = 7311,

  -- ME network component and Database upgrade. nil = first one found.
  ae2 = { network = nil, database = nil },

  -- One entry per robot cell. Addresses are the ME Interface *component*
  -- addresses (Adapter touching each interface). Use `components` in the
  -- OC shell to list them.
  cells = {
    cell1 = {
      housing = "gt_iapiary",
      mainInterface = "put-address-here",
      beeInterface = "put-address-here",
      base = { temp = 0.8, hum = 0.4 },   -- biome the cell sits in (plains shown)
    },
  },

  -- Remote stations you have built. Only listed conditions are plannable.
  stations = {
    -- dimension = { ["End"] = true, ["Moon"] = true },
    -- biomeId = { ["Magical Forest"] = true },
    -- gtmachine = true,
  },

  defaults = { keepDrones = 8, droneSupply = 16, maxGenerations = 400, warnAfter = 60 },

  honeyLabel = "Honey Drop",
  honeyStock = 64,

  -- planner weights
  chanceWeight = 0.1,          -- cost per (100 / chance)
  foundationCostBase = 2,

  -- species never bred at home (dangerous effects)
  effectBlacklist = {},

  -- Discord: create a bot, invite it with Send Messages + Read Message History
  discord = {
    enabled = false,
    token = nil,               -- "Bot token here"
    channel = nil,             -- "channel id"
    webhook = nil,             -- optional, posting only
    pollInterval = 5,
    prefix = "!",
    statusInterval = 0,        -- seconds between live status message updates, 0 = off
  },

  -- Extra condition parsers if the survey reports unparsed strings.
  conditionPatterns = {
    -- { pattern = "^Occurs only in dimension (.+)$", kind = "dimension" },
  },

  gui = true,
}
